<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 Quantum MCAGI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;
  --text:#e0e0e0;--dim:#888;--accent:#7c3aed;
  --accent2:#a78bfa;--glow:rgba(124,58,237,.15);
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
a{color:var(--accent2)}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.header h1{font-size:18px;font-weight:600}
.header h1 span{color:var(--accent2)}
.header-right{display:flex;gap:10px;align-items:center}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.status-dot.off{background:var(--red)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--accent);background:var(--glow)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:#6d28d9}
.btn-sm{padding:4px 10px;font-size:12px}

/* Main layout */
.main{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:260px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-header h3{font-size:14px;color:var(--dim)}
.sessions{flex:1;overflow-y:auto;padding:8px}
.session-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.session-item:hover{background:var(--glow)}
.session-item.active{background:var(--glow);border:1px solid var(--accent)}
.session-del{color:var(--dim);cursor:pointer;font-size:11px;opacity:0}
.session-item:hover .session-del{opacity:1}

/* Sidebar status panel */
.status-panel{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--dim)}
.status-panel .stat{display:flex;justify-content:space-between;padding:3px 0}
.status-panel .stat-val{color:var(--accent2)}

/* Chat area */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}

.msg{max-width:80%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:transparent;color:var(--dim);font-size:12px;font-style:italic;padding:4px}

.msg .concepts{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.msg .concepts span{background:var(--glow);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:11px;color:var(--accent2)}
.msg .questions{margin-top:8px;font-size:12px;color:var(--dim);border-top:1px solid var(--border);padding-top:6px}
.msg .questions div{padding:2px 0}
.msg .questions div::before{content:"💭 "}

/* Typing indicator */
.typing{align-self:flex-start;padding:12px 16px;font-size:13px;color:var(--dim)}
.typing span{animation:blink 1.4s infinite both}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* Input area */
.input-area{padding:16px 20px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;resize:none;min-height:44px;max-height:150px;line-height:1.5;outline:none;transition:.15s}
.input-row textarea:focus{border-color:var(--accent)}
.input-row textarea::placeholder{color:var(--dim)}
.send-btn{width:44px;height:44px;border-radius:8px;background:var(--accent);border:none;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.send-btn:hover{background:#6d28d9}
.send-btn:disabled{opacity:.4;cursor:default}
.input-hint{font-size:11px;color:var(--dim);margin-top:6px;padding-left:2px}

/* Commands dropdown */
.commands-bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.cmd-chip{padding:3px 10px;border:1px solid var(--border);border-radius:12px;font-size:11px;cursor:pointer;color:var(--dim);transition:.15s}
.cmd-chip:hover{border-color:var(--accent);color:var(--accent2);background:var(--glow)}

/* Mobile */
@media(max-width:700px){
  .sidebar{display:none}
  .msg{max-width:95%}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#333}
</style>
</head>
<body>

<div class="header">
  <h1>🔮 <span>Quantum MCAGI</span></h1>
  <div class="header-right">
    <span class="status-dot" id="statusDot" title="Disconnected"></span>
    <button class="btn btn-sm" onclick="loadStatus()" title="Refresh status">⟳</button>
    <a href="/docs" class="btn btn-sm" title="API Docs">API</a>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>Sessions</h3>
      <button class="btn btn-sm btn-accent" onclick="newSession()">+ New</button>
    </div>
    <div class="sessions" id="sessionList"></div>
    <div class="status-panel" id="statusPanel">
      <div class="stat"><span>Stage</span><span class="stat-val" id="stStage">—</span></div>
      <div class="stat"><span>Concepts</span><span class="stat-val" id="stConcepts">—</span></div>
      <div class="stat"><span>Markov</span><span class="stat-val" id="stMarkov">—</span></div>
      <div class="stat"><span>Quantum</span><span class="stat-val" id="stQuantum">—</span></div>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg system">Welcome to Quantum MCAGI — a TRUE AI with no LLM. Type a message or try a command below.</div>
    </div>
    <div class="input-area">
      <div class="commands-bar">
        <span class="cmd-chip" onclick="insertCmd('/status')">/status</span>
        <span class="cmd-chip" onclick="insertCmd('/help')">/help</span>
        <span class="cmd-chip" onclick="insertCmd('/think ')">/think</span>
        <span class="cmd-chip" onclick="insertCmd('/dream')">/dream</span>
        <span class="cmd-chip" onclick="insertCmd('/test')">/test</span>
        <span class="cmd-chip" onclick="insertCmd('/feed')">/feed</span>
        <span class="cmd-chip" onclick="insertCmd('/learn ')">/learn</span>
        <span class="cmd-chip" onclick="insertCmd('/quote')">/quote</span>
      </div>
      <div class="input-row">
        <textarea id="input" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">▶</button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line · Slash commands: /help /status /think /dream</div>
    </div>
  </div>
</div>

<script>
const API = '/api';
let sessionId = localStorage.getItem('mcagi_session') || crypto.randomUUID();
let sessions = JSON.parse(localStorage.getItem('mcagi_sessions') || '{}');
let sending = false;

// Ensure current session exists
if (!sessions[sessionId]) {
  sessions[sessionId] = { name: 'Chat ' + Object.keys(sessions).length, created: Date.now(), messages: [] };
  saveSessions();
}

function saveSessions() {
  localStorage.setItem('mcagi_sessions', JSON.stringify(sessions));
  localStorage.setItem('mcagi_session', sessionId);
}

function renderSessions() {
  const el = document.getElementById('sessionList');
  const keys = Object.keys(sessions).sort((a, b) => (sessions[b].created || 0) - (sessions[a].created || 0));
  el.innerHTML = keys.map(id => {
    const s = sessions[id];
    const active = id === sessionId ? ' active' : '';
    const count = (s.messages || []).length;
    const label = s.name || 'Chat';
    return `<div class="session-item${active}" onclick="switchSession('${id}')">
      <span>${label} <span style="color:var(--dim);font-size:11px">(${count})</span></span>
      <span class="session-del" onclick="event.stopPropagation();deleteSession('${id}')">✕</span>
    </div>`;
  }).join('');
}

function newSession() {
  sessionId = crypto.randomUUID();
  sessions[sessionId] = { name: 'Chat ' + Object.keys(sessions).length, created: Date.now(), messages: [] };
  saveSessions();
  renderSessions();
  renderMessages();
}

function switchSession(id) {
  sessionId = id;
  saveSessions();
  renderSessions();
  renderMessages();
}

function deleteSession(id) {
  delete sessions[id];
  if (id === sessionId) {
    const keys = Object.keys(sessions);
    if (keys.length) { sessionId = keys[0]; }
    else { newSession(); return; }
  }
  saveSessions();
  renderSessions();
  renderMessages();
}

function renderMessages() {
  const el = document.getElementById('messages');
  const msgs = sessions[sessionId]?.messages || [];
  el.innerHTML = '<div class="msg system">Welcome to Quantum MCAGI — a TRUE AI with no LLM. Type a message or try a command below.</div>';
  msgs.forEach(m => appendMessageDOM(m.role, m.text, m.concepts, m.questions, false));
  el.scrollTop = el.scrollHeight;
}

function appendMessageDOM(role, text, concepts, questions, scroll = true) {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  
  let html = escapeHtml(text);
  if (concepts && concepts.length) {
    html += '<div class="concepts">' + concepts.map(c => '<span>' + escapeHtml(c) + '</span>').join('') + '</div>';
  }
  if (questions && questions.length) {
    html += '<div class="questions">' + questions.map(q => '<div>' + escapeHtml(q) + '</div>').join('') + '</div>';
  }
  div.innerHTML = html;
  el.appendChild(div);
  if (scroll) el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span>●</span><span>●</span><span>●</span> thinking...';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || sending) return;
  
  sending = true;
  document.getElementById('sendBtn').disabled = true;
  
  // Add user message
  appendMessageDOM('user', text);
  if (!sessions[sessionId].messages) sessions[sessionId].messages = [];
  sessions[sessionId].messages.push({ role: 'user', text });
  
  // Auto-name session from first message
  if (sessions[sessionId].messages.length === 1) {
    sessions[sessionId].name = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  }
  saveSessions();
  renderSessions();
  
  input.value = '';
  autoGrow(input);
  showTyping();
  
  try {
    const res = await fetch(API + '/quantum/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, session_id: sessionId })
    });
    
    hideTyping();
    
    if (!res.ok) {
      const err = await res.text();
      appendMessageDOM('system', '⚠️ Error: ' + res.status + ' ' + err);
    } else {
      const data = await res.json();
      const aiText = data.response || '(no response)';
      const concepts = data.concepts || [];
      const questions = data.questions || [];
      
      appendMessageDOM('ai', aiText, concepts, questions);
      sessions[sessionId].messages.push({ role: 'ai', text: aiText, concepts, questions });
      saveSessions();
    }
  } catch (e) {
    hideTyping();
    appendMessageDOM('system', '⚠️ Connection error: ' + e.message);
  }
  
  sending = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function insertCmd(cmd) {
  const input = document.getElementById('input');
  input.value = cmd;
  input.focus();
  if (!cmd.endsWith(' ')) sendMessage();
}

async function loadStatus() {
  const dot = document.getElementById('statusDot');
  try {
    const res = await fetch(API + '/brain/status');
    if (res.ok) {
      const data = await res.json();
      dot.className = 'status-dot';
      dot.title = 'Connected';
      
      // Update stats panel
      const s = data.status || data;
      document.getElementById('stStage').textContent = s.growth_stage || s.stage || '—';
      document.getElementById('stConcepts').textContent = s.total_concepts ?? s.concepts ?? '—';
      document.getElementById('stMarkov').textContent = s.markov_states ?? '—';
      document.getElementById('stQuantum').textContent = s.quantum_mode ? '✓ ON' : '○ OFF';
    } else {
      dot.className = 'status-dot off';
      dot.title = 'Error';
    }
  } catch {
    dot.className = 'status-dot off';
    dot.title = 'Disconnected';
  }
}

// Init
renderSessions();
renderMessages();
loadStatus();
setInterval(loadStatus, 30000);
document.getElementById('input').focus();
</script>
</body>
</html>
